name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  publish-agent:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Conferir a sintaxe dos scripts no Windows PowerShell 5.1 (o do PC da loja)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $failed = $true; Write-Host "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($failed) { exit 1 }
      - run: dotnet publish src/MarumbiSom.Agent -c Release -r win-x64 --self-contained -o publish/agent
      - name: Baixar mpv (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -Destination publish/agent/tools
        shell: pwsh
      - name: DLLs do mpv presentes num Windows 10 sem driver de vídeo
        run: ./.github/scripts/conferir-dlls-tools.ps1 -Tools publish/agent/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/agent/scripts
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Agent-win-x64
          path: publish/agent
          retention-days: 30
