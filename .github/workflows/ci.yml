name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Fixo no 24.04: o ubuntu-latest passa para o Ubuntu 26 aos poucos desde 19/10/2026, e o cache dos pacotes do ffmpeg
    # abaixo vale para uma versão só.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # O apt às vezes trava no espelho do Ubuntu: listas e pacotes da última instalação ficam no cache do Actions
      # (renovado toda semana) e a instalação pela rede só acontece sem cache. Detalhes em .github/scripts/instalar-ffmpeg.sh.
      - name: Semana do cache do ffmpeg
        id: semana
        run: echo "id=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Pacotes do ffmpeg no cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.semana.outputs.id }}
          restore-keys: apt-ffmpeg-ubuntu-24.04-
      - name: ffmpeg para os testes de ingestão do Hub
        id: ffmpeg
        timeout-minutes: 25
        run: .github/scripts/instalar-ffmpeg.sh "$RUNNER_TEMP/apt-ffmpeg"
      - name: Guardar os pacotes do ffmpeg no cache
        if: steps.ffmpeg.outputs.salvar == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.semana.outputs.id }}
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  panel:
    # Fixo no 24.04 pelo mesmo motivo do job de testes (o cache dos pacotes do ffmpeg vale para uma versão só).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/panel/package-lock.json
      # Mesmo cache e mesma instalação do job de testes (o apt às vezes trava no espelho do Ubuntu).
      - name: Semana do cache do ffmpeg
        id: semana
        run: echo "id=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Pacotes do ffmpeg no cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.semana.outputs.id }}
          restore-keys: apt-ffmpeg-ubuntu-24.04-
      - name: ffmpeg para a ingestão do Hub no teste ponta a ponta
        id: ffmpeg
        timeout-minutes: 25
        run: '"$GITHUB_WORKSPACE/.github/scripts/instalar-ffmpeg.sh" "$RUNNER_TEMP/apt-ffmpeg"'
      - name: Guardar os pacotes do ffmpeg no cache
        if: steps.ffmpeg.outputs.salvar == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.semana.outputs.id }}
      - run: npm ci
      - name: Tipos do painel em dia com o openapi.json do Hub (seção 7.3)
        run: npm run api && git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Ponta a ponta (Hub real, agente simulado, navegador)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/panel/playwright-report
            web/panel/test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: web/panel/dist
          retention-days: 7

  publish:
    runs-on: windows-latest
    needs: [test, panel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Conferir a sintaxe dos scripts no Windows PowerShell 5.1 (o do PC da loja)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $failed = $true; Write-Host "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($failed) { exit 1 }
      - run: dotnet publish src/MarumbiSom.Agent -c Release -r win-x64 --self-contained -o publish/agent
      - name: Baixar mpv (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -Destination publish/agent/tools
        shell: pwsh
      - name: DLLs do mpv presentes num Windows 10 sem driver de vídeo
        run: ./.github/scripts/conferir-dlls-tools.ps1 -Tools publish/agent/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/agent/scripts
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Agent-win-x64
          path: publish/agent
          retention-days: 30
      - run: dotnet publish src/MarumbiSom.Hub -c Release -r win-x64 --self-contained -o publish/hub
      - name: Painel (build do job panel) em wwwroot
        uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: publish/hub/wwwroot
      - name: Baixar ffmpeg e ffprobe (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -For hub -Destination publish/hub/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/hub/scripts
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Hub-win-x64
          path: publish/hub
          retention-days: 30
