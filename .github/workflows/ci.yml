name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Fixo no 24.04: o ubuntu-latest passa para o Ubuntu 26 aos poucos desde 19/10/2026 e, desde 27/10, o apt do ffmpeg
    # falha em parte das execuções (as três tentativas abaixo esgotadas).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: ffmpeg para os testes de ingestão do Hub
        # O apt às vezes trava no espelho do Ubuntu (já ficou 30 min parado): cada tentativa tem limite e são até 3.
        timeout-minutes: 20
        run: |
          command -v ffmpeg && exit 0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            # Anotação, e não só echo: o log do job nem sempre está acessível, as anotações sim.
            echo "::warning::Instalação do ffmpeg falhou ou travou (tentativa $i de 3, código $?, $(lsb_release -ds))."
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/panel/package-lock.json
      - name: ffmpeg para a ingestão do Hub no teste ponta a ponta
        # Mesmo limite e tentativas do job de testes: o apt às vezes trava no espelho do Ubuntu.
        timeout-minutes: 20
        run: |
          command -v ffmpeg && exit 0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            echo "Instalação do ffmpeg falhou ou travou (tentativa $i de 3)."
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - run: npm ci
      - name: Tipos do painel em dia com o openapi.json do Hub (seção 7.3)
        run: npm run api && git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Ponta a ponta (Hub real, agente simulado, navegador)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/panel/playwright-report
            web/panel/test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: web/panel/dist
          retention-days: 7

  publish:
    runs-on: windows-latest
    needs: [test, panel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Conferir a sintaxe dos scripts no Windows PowerShell 5.1 (o do PC da loja)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $failed = $true; Write-Host "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($failed) { exit 1 }
      - run: dotnet publish src/MarumbiSom.Agent -c Release -r win-x64 --self-contained -o publish/agent
      - name: Baixar mpv (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -Destination publish/agent/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/agent/scripts
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Agent-win-x64
          path: publish/agent
          retention-days: 30
      - run: dotnet publish src/MarumbiSom.Hub -c Release -r win-x64 --self-contained -o publish/hub
      - name: Painel (build do job panel) em wwwroot
        uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: publish/hub/wwwroot
      - name: Baixar ffmpeg e ffprobe (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -For hub -Destination publish/hub/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/hub/scripts
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Hub-win-x64
          path: publish/hub
          retention-days: 30
