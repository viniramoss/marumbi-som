name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar versão do agente e do Hub no GitHub Releases (o Hub baixa sozinho)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: ffmpeg para os testes de ingestão do Hub
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/panel/package-lock.json
      - name: ffmpeg para a ingestão do Hub no teste ponta a ponta
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
      - name: Tipos do painel em dia com o openapi.json do Hub (seção 7.3)
        run: npm run api && git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Ponta a ponta (Hub real, agente simulado, navegador)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/panel/playwright-report
            web/panel/test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: web/panel/dist
          retention-days: 1

  publish:
    runs-on: windows-latest
    needs: [test, panel]
    env:
      # Versão do agente e do Hub; os pacotes assinados e o instalador levam esta versão (D27 b).
      VERSION: 0.6.${{ github.run_number }}
      # Junção no main ou execução manual com "publicar": assina os pacotes do agente e do Hub e publica a Release (D29, D32).
      PUBLICAR: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publicar) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Conferir a sintaxe dos scripts no Windows PowerShell 5.1 (o do PC da loja)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $failed = $true; Write-Host "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($failed) { exit 1 }
      - run: dotnet publish src/MarumbiSom.Agent -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish/agent
      - name: Updater (um .exe só) na pasta do agente (D27 e)
        run: dotnet publish src/MarumbiSom.Updater -c Release -r win-x64 -p:Version=${{ env.VERSION }} -p:DebugType=none -o publish/agent
      - name: Baixar mpv (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -Destination publish/agent/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/agent/scripts
        shell: pwsh
      - name: Pasta do agente completa para o pacote assinado
        shell: pwsh
        run: |
          foreach ($file in 'MarumbiSom.Agent.exe', 'MarumbiSom.Agent.dll', 'MarumbiSom.Updater.exe', 'release-public-key.txt', 'tools/mpv.exe') {
            if (-not (Test-Path "publish/agent/$file")) { throw "Falta $file em publish/agent" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Agent-win-x64
          path: publish/agent
          retention-days: 7
      - name: Instalador do agente (Inno Setup, D27 g)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup falhou ($LASTEXITCODE)" }
          }
          & $iscc "/DAppVersion=$env:VERSION" '/DSourceDir=..\publish\agent' installer/agent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Agent-Setup
          path: publish/installer
          retention-days: 7
      - name: Ferramenta de chave e assinatura (roda no PC do administrador, D27 b)
        shell: pwsh
        run: |
          dotnet publish src/MarumbiSom.Release -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -o publish/release-tool
          if ($LASTEXITCODE -ne 0) { throw "publish falhou ($LASTEXITCODE)" }
          Copy-Item scripts/new-signing-key.ps1, scripts/sign-release.ps1, scripts/release-tool.ps1 publish/release-tool
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Release-win-x64
          path: publish/release-tool
          retention-days: 7
      - run: dotnet publish src/MarumbiSom.Hub -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish/hub
      - name: Updater (um .exe só) na pasta do Hub, para a tarefa do atualizador do Hub (D32 c)
        run: dotnet publish src/MarumbiSom.Updater -c Release -r win-x64 -p:Version=${{ env.VERSION }} -p:DebugType=none -o publish/hub
      - name: Painel (build do job panel) em wwwroot
        uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: publish/hub/wwwroot
      - name: Baixar ffmpeg e ffprobe (SHA-256 conferido pelo tools.lock.json)
        run: ./scripts/download-tools.ps1 -For hub -Destination publish/hub/tools
        shell: pwsh
      - run: Copy-Item -Recurse scripts publish/hub/scripts
        shell: pwsh
      - name: Pasta do Hub completa para o pacote assinado
        shell: pwsh
        run: |
          foreach ($file in 'MarumbiSom.Hub.exe', 'MarumbiSom.Hub.dll', 'MarumbiSom.Updater.exe', 'release-public-key.txt', 'wwwroot/index.html', 'tools/ffmpeg.exe', 'tools/ffprobe.exe', 'scripts/install-hub.ps1') {
            if (-not (Test-Path "publish/hub/$file")) { throw "Falta $file em publish/hub" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MarumbiSom.Hub-win-x64
          path: publish/hub
          retention-days: 7
      - name: Assinar os pacotes do agente e do Hub com a chave guardada no secret (D29, D32)
        if: env.PUBLICAR == 'true'
        shell: pwsh
        env:
          MARUMBI_SIGNING_KEY: ${{ secrets.MARUMBI_SIGNING_KEY }}
        run: |
          if (-not $env:MARUMBI_SIGNING_KEY) { throw 'O secret MARUMBI_SIGNING_KEY não está cadastrado no repositório (veja "Atualizar o agente" no docs/runbook.md).' }
          $key = Join-Path $env:RUNNER_TEMP 'chave-assinatura.txt'
          try {
            [IO.File]::WriteAllText($key, $env:MARUMBI_SIGNING_KEY)
            # Recusa se a chave não for a do release-public-key.txt do build (lojas e Hub deixariam de aceitar atualizações).
            & publish/release-tool/MarumbiSom.Release.exe pack --key $key --agent publish/agent --out publish/release
            if ($LASTEXITCODE -ne 0) { throw "Assinatura do pacote do agente falhou ($LASTEXITCODE)" }
            # Assinatura própria do Hub (marumbi-som-hub|...): um pacote do agente não passa por pacote do Hub.
            & publish/release-tool/MarumbiSom.Release.exe pack --key $key --hub publish/hub --out publish/release
            if ($LASTEXITCODE -ne 0) { throw "Assinatura do pacote do Hub falhou ($LASTEXITCODE)" }
          }
          finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: env.PUBLICAR == 'true'
        with:
          name: MarumbiSom-assinados
          path: publish/release
          retention-days: 7

  release:
    name: Publicar no GitHub Releases (D29)
    runs-on: ubuntu-latest
    needs: publish
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    permissions:
      contents: write
    env:
      VERSION: 0.6.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarumbiSom-assinados
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: MarumbiSom.Agent-Setup
          path: release
      - name: Criar a Release (fora do main fica como pré-lançamento)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          tag="agente-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A Release $tag já existe (execução repetida); nada a fazer."
            exit 0
          fi
          flags=()
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then flags+=(--prerelease); fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agente $VERSION" "${flags[@]}" \
            --notes "Versão $VERSION (${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Agente: o Hub baixa sozinho o pacote assinado (MarumbiSom.Agent-$VERSION.zip e .sig.json). Atualize as lojas no painel, em Configurações (loja piloto primeiro).
          - Instalador para loja nova: MarumbiSom.Agent-Setup-$VERSION.exe.
          - Hub: o Hub baixa sozinho o pacote assinado (MarumbiSom.Hub-$VERSION.zip e .sig.json) e se instala às 03:00, ou em Configurações > Atualização do Hub > Atualizar o Hub agora. O zip também serve para instalar à mão pelo scripts\install-hub.ps1."
